spring:
  application:
    name: budgetix

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/budgetix}
    username: ${POSTGRES_USER:budgetix}
    password: ${POSTGRES_PASSWORD:budgetix_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: 10MB

  cache:
    type: simple

server:
  port: ${PORT:3000}
  servlet:
    context-path: /api

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:budgetix_access_secret_min_32_chars_long}
    refresh-secret: ${JWT_REFRESH_SECRET:budgetix_refresh_secret_min_32_chars_long}
    access-expiry-ms: 900000       # 15 minutes
    refresh-expiry-ms: 604800000   # 7 days

  frontend-url: ${FRONTEND_URL:http://localhost:4300}
  mail-from: ${MAIL_FROM:noreply@budgetix.app}
  upload-dir: ${UPLOAD_DIR:uploads}

  verification:
    max-resend-attempts: ${VERIFICATION_MAX_RESEND:3}   # total OTP requests per window (incl. initial)
    resend-window-hours: ${VERIFICATION_WINDOW_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.budgetix: DEBUG
    org.springframework.security: INFO
